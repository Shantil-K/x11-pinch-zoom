<touchégg>

  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">10</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <!-- Pinch zoom in browsers is handled by the Multi-touch Zoom native helper
       (native-host/pinch_host.py), which listens to the Touchégg daemon directly.
       No pinch actions here, so the two don't zoom at the same time. -->

</touchégg>
